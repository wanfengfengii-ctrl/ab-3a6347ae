services:
  web:
    build:
      context: .
    image: archive-rebuild:latest
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 一次性验收服务：代码测试 + 前端构建 + API 冒烟，自行退出并以退出码报告结果。
  # 用法：docker compose run --rm verify  或  docker compose up --abort-on-container-exit verify
  verify:
    image: archive-rebuild:latest
    build:
      context: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:8000
      PYTHON: /opt/venv/bin/python
    working_dir: /app
    entrypoint: ["/bin/bash", "/app/scripts/verify.sh"]
    restart: "no"
